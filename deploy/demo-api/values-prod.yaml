# demo-api on EKS prod. image.repository / image.digest are set by CI.
nameOverride: demo-api
image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/demo-api
config:
  LLM_BACKEND: openai
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
  LLM_TIMEOUT: 20s
  LOG_LEVEL: info
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 256Mi
autoscaling:
  minReplicas: 3
  maxReplicas: 30
topologySpread:
  zoneWhenUnsatisfiable: DoNotSchedule
metrics:
  serviceMonitor:
    enabled: true
networkPolicy:
  ingressNamespaces: [kube-system]
externalSecret:
  enabled: true
  data:
    - secretKey: LLM_API_KEY
      remoteRef:
        key: platform/prod/demo-api
        property: llm_api_key
