# demo-api on EKS staging. image.repository / image.digest are set by CI.
nameOverride: demo-api
image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/demo-api
config:
  LLM_BACKEND: openai
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
  LLM_TIMEOUT: 20s
  LOG_LEVEL: debug
autoscaling:
  minReplicas: 2
  maxReplicas: 4
metrics:
  serviceMonitor:
    enabled: true
networkPolicy:
  ingressNamespaces: [kube-system] # AWS Load Balancer Controller health checks via target type ip
externalSecret:
  enabled: true
  data:
    - secretKey: LLM_API_KEY
      remoteRef:
        key: platform/staging/demo-api
        property: llm_api_key
