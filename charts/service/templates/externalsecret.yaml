{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret }}
{{- if not $es.data }}
{{- fail "externalSecret.enabled=true requires at least one entry in externalSecret.data" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "service.fullname" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- toYaml $es.data | nindent 4 }}
{{- end }}
