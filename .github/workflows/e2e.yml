name: e2e-kind

on:
  pull_request:
    paths: ["apps/**", "charts/**", "local/**", "Makefile", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "charts/**", "local/**", "Makefile", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: install kind (cluster is created by make local-up)
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          install_only: true
      - name: make local-up
        run: make local-up
      - name: make local-test
        run: make local-test
      - name: diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl -n demo describe pods || true
          kubectl -n demo logs -l app.kubernetes.io/name=demo-api --tail=100 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
      - name: make local-down
        if: always()
        run: make local-down
