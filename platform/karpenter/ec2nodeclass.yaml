# Applied after `helm install karpenter` (see docs/runbook.md).
# Values match terraform/envs/prod (cluster pb-prod, node role pb-prod-node);
# see `terraform output karpenter`.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: pb-prod-node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: pb-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: pb-prod
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 80Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
