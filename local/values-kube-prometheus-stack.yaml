# Trimmed kube-prometheus-stack for a laptop / CI runner: Prometheus + operator
# + kube-state-metrics. Grafana and Alertmanager are off to save ~400Mi.
grafana:
  enabled: false
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  create: false
prometheus:
  prometheusSpec:
    # Discover ServiceMonitors from every namespace regardless of Helm labels.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
